---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2025 The Linux Foundation

# Action test/validation workflow
name: 'Test GitHub Action 🧪'

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
    paths:
      - '**'
      - '!.github/**'
      - '!.*'
      - '!tox.ini'

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

permissions: {}

jobs:
  ### Test the GitHub Action in this Repository ###
  tests:
    name: 'Test repository metadata action'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # Required to read PR context for metadata extraction
    timeout-minutes: 5
    steps:
      # Harden the runner used by this workflow
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        name: 'Harden runner'
        with:
          egress-policy: audit

      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Required for changed files detection
          persist-credentials: false

      - name: 'Test repository metadata action (with GitHub API)'
        id: metadata
        uses: $/
        with:
          debug: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_summary: true

      - name: 'Validate outputs'
        shell: bash
        env:
          METADATA_JSON: ${{ steps.metadata.outputs.metadata_json }}
          METADATA_YAML: ${{ steps.metadata.outputs.metadata_yaml }}
          # yamllint disable-line rule:line-length
          STEPS_METADATA_OUTPUTS_REPOSITORY_OWNER: ${{ steps.metadata.outputs.repository_owner }}
          # yamllint disable-line rule:line-length
          STEPS_METADATA_OUTPUTS_REPOSITORY_NAME: ${{ steps.metadata.outputs.repository_name }}
          # yamllint disable-line rule:line-length
          STEPS_METADATA_OUTPUTS_COMMIT_SHA: ${{ steps.metadata.outputs.commit_sha }}
          # yamllint disable-line rule:line-length
          STEPS_METADATA_OUTPUTS_EVENT_NAME: ${{ steps.metadata.outputs.event_name }}
          # yamllint disable-line rule:line-length
          STEPS_METADATA_OUTPUTS_IS_PULL_REQUEST: ${{ steps.metadata.outputs.is_pull_request }}
        # yamllint disable rule:line-length
        run: |
          # Validate repository metadata outputs
          {
            echo '## Validation Results'
            echo ''
          } >> "$GITHUB_STEP_SUMMARY"

          # Validate JSON output
          if [ -z "$METADATA_JSON" ]; then
            {
              echo '### 📋 JSON Output Validation'
              echo '❌ metadata_json output is empty'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            # Validate JSON is parseable
            if echo "$METADATA_JSON" | jq . > /dev/null 2>&1; then
              {
                echo '### 📋 JSON Output Validation'
                echo '✅ metadata_json populated'
                echo '✅ metadata_json is valid JSON'
                echo ''
              } >> "$GITHUB_STEP_SUMMARY"
            else
              {
                echo '### 📋 JSON Output Validation'
                echo '✅ metadata_json populated'
                echo '❌ metadata_json is not valid JSON'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          fi

          # Validate YAML output
          if [ -z "$METADATA_YAML" ]; then
            {
              echo '### 📄 YAML Output Validation'
              echo '❌ metadata_yaml output is empty'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            # Validate YAML is parseable
            if echo "$METADATA_YAML" | yq eval . > /dev/null 2>&1; then
              {
                echo '### 📄 YAML Output Validation'
                echo '✅ metadata_yaml populated'
                echo '✅ metadata_yaml is valid YAML'
                echo ''
              } >> "$GITHUB_STEP_SUMMARY"
            else
              {
                echo '### 📄 YAML Output Validation'
                echo '✅ metadata_yaml populated'
                echo '❌ metadata_yaml is not valid YAML'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          fi

          # Validate JSON and YAML contain same data
          json_owner=$(echo "$METADATA_JSON" | jq -r '.repository.owner')
          yaml_owner=$(echo "$METADATA_YAML" | yq eval '.repository.owner' -)

          if [ "$json_owner" != "$yaml_owner" ]; then
            {
              echo '### 🔄 Format Consistency Validation'
              echo "❌ JSON/YAML mismatch: JSON owner=$json_owner, YAML owner=$yaml_owner"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            {
              echo '### 🔄 Format Consistency Validation'
              echo '✅ JSON and YAML contain consistent data'
              echo ''
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # Validate expected values
          expected_owner="${GITHUB_REPOSITORY_OWNER}"
          expected_name="${GITHUB_REPOSITORY#"$GITHUB_REPOSITORY_OWNER"/}"
          actual_owner="${STEPS_METADATA_OUTPUTS_REPOSITORY_OWNER}"
          actual_name="${STEPS_METADATA_OUTPUTS_REPOSITORY_NAME}"

          {
            echo '### 🧪 Value Validation'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$actual_owner" != "$expected_owner" ]; then
            {
              echo "❌ owner mismatch: expected $expected_owner, got $actual_owner"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            {
              echo "✅ Owner matches: $expected_owner"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$actual_name" != "$expected_name" ]; then
            {
              echo "❌ name mismatch: expected $expected_name, got $actual_name"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            {
              echo "✅ Name matches: $expected_name"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # Validate commit SHA
          expected_sha="$GITHUB_SHA"
          actual_sha="${STEPS_METADATA_OUTPUTS_COMMIT_SHA}"
          if [ "$actual_sha" != "$expected_sha" ]; then
            {
              echo "❌ SHA mismatch: expected $expected_sha, got $actual_sha"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            expected_sha_short="${expected_sha:0:7}"
            {
              echo "✅ SHA matches: ${expected_sha_short}"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # Validate event detection logic
          event_name="${STEPS_METADATA_OUTPUTS_EVENT_NAME}"
          is_pr="${STEPS_METADATA_OUTPUTS_IS_PULL_REQUEST}"

          if [ "$event_name" = "pull_request" ]; then
            if [ "$is_pr" != "true" ]; then
              {
                echo "❌ PR event detected but is_pull_request is not true"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            else
              {
                echo '✅ PR event correctly detected'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

          {
            echo ''
            echo '## ✅ All tests passed'
          } >> "$GITHUB_STEP_SUMMARY"
        # yamllint enable rule:line-length

      - name: 'Test repository metadata action (with Git detection)'
        id: metadata-git
        uses: $/
        with:
          debug: true
          change_detection: git
          github_summary: false

      - name: 'Validate Git fallback outputs'
        shell: bash
        # yamllint disable rule:line-length
        run: |
          # Validate that Git detection produced results
          {
            echo '## Git Detection Test'
            echo ''
          } >> "$GITHUB_STEP_SUMMARY"

          # Validate basic outputs still work
          expected_owner="${GITHUB_REPOSITORY_OWNER}"
          actual_owner="${STEPS_METADATA_GIT_OUTPUTS_REPOSITORY_OWNER}"

          if [ "$actual_owner" != "$expected_owner" ]; then
            {
              echo "❌ Git detection: owner mismatch"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            {
              echo "✅ Git detection: Owner matches: $expected_owner"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # Validate commit SHA
          expected_sha="$GITHUB_SHA"
          actual_sha="${STEPS_METADATA_GIT_OUTPUTS_COMMIT_SHA}"
          if [ "$actual_sha" != "$expected_sha" ]; then
            {
              echo "❌ Git detection: SHA mismatch"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            {
              echo "✅ Git detection: SHA matches"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # Git-derived outputs. These stay empty if the action inspects
          # its own download (which has no .git) instead of the workspace.
          fail_if_differs() {
            local label="$1" expected="$2" actual="$3"
            if [ "$actual" != "$expected" ]; then
              echo "❌ Git detection: $label mismatch" >> "$GITHUB_STEP_SUMMARY"
              printf '%s expected:\n%s\n%s actual:\n%s\n' \
                "$label" "$expected" "$label" "$actual" >&2
              exit 1
            fi
            echo "✅ Git detection: $label matches" >> "$GITHUB_STEP_SUMMARY"
          }
          sorted_lines() { printf '%s\n' "$1" | LC_ALL=C sort; }
          git_changed() { git -c core.quotePath=false diff --name-only -M "$@"; }

          if [ -z "$STEPS_METADATA_GIT_OUTPUTS_COMMIT_MESSAGE" ]; then
            echo "❌ Git detection: commit_message is empty" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          full_message="$(git show -s --format=%B "$GITHUB_SHA")"
          fail_if_differs 'commit_message' \
            "${full_message%%$'\n'*}" "$STEPS_METADATA_GIT_OUTPUTS_COMMIT_MESSAGE"

          last_commit_files="$(git_changed HEAD^1 HEAD)"
          fail_if_differs 'changed_files_last_commit' \
            "$(sorted_lines "$last_commit_files")" \
            "$(sorted_lines "$STEPS_METADATA_GIT_OUTPUTS_CHANGED_FILES_LAST_COMMIT")"

          # change_detection only selects the strategy for pull requests
          if [ "$GITHUB_EVENT_NAME" = 'pull_request' ]; then
            pr_files="$(git_changed "origin/${GITHUB_BASE_REF}...HEAD")"
            fail_if_differs 'changed_files' \
              "$(sorted_lines "$pr_files")" \
              "$(sorted_lines "$STEPS_METADATA_GIT_OUTPUTS_CHANGED_FILES")"
          fi

          {
            echo ''
            echo '✅ Git detection test passed'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          STEPS_METADATA_GIT_OUTPUTS_REPOSITORY_OWNER: ${{ steps.metadata-git.outputs.repository_owner }}
          STEPS_METADATA_GIT_OUTPUTS_COMMIT_SHA: ${{ steps.metadata-git.outputs.commit_sha }}
          STEPS_METADATA_GIT_OUTPUTS_COMMIT_MESSAGE: ${{ steps.metadata-git.outputs.commit_message }}
          STEPS_METADATA_GIT_OUTPUTS_CHANGED_FILES: ${{ steps.metadata-git.outputs.changed_files }}
          STEPS_METADATA_GIT_OUTPUTS_CHANGED_FILES_LAST_COMMIT: ${{ steps.metadata-git.outputs.changed_files_last_commit }}
          # yamllint enable rule:line-length

      - name: 'Test JSON parsing'
        shell: bash
        env:
          METADATA_JSON: ${{ steps.metadata.outputs.metadata_json }}
        # yamllint disable rule:line-length
        run: |
          # Test parsing JSON output

          # Extract values from JSON
          repo_owner=$(echo "$METADATA_JSON" | jq -r '.repository.owner')
          repo_name=$(echo "$METADATA_JSON" | jq -r '.repository.name')
          commit_sha=$(echo "$METADATA_JSON" | jq -r '.commit.sha_short')
          event_name=$(echo "$METADATA_JSON" | jq -r '.event.name')

          {
            echo '## JSON Parsing Test'
            echo ''
            echo "- Repository Owner: $repo_owner"
            echo "- Repository Name: $repo_name"
            echo "- Commit SHA: $commit_sha"
            echo "- Event Name: $event_name"
            echo ''
            echo '✅ JSON parsing successful'
          } >> "$GITHUB_STEP_SUMMARY"
        # yamllint enable rule:line-length

      - name: 'Test YAML parsing'
        shell: bash
        env:
          METADATA_YAML: ${{ steps.metadata.outputs.metadata_yaml }}
        # yamllint disable rule:line-length
        run: |
          # Test parsing YAML output

          # Extract values from YAML
          repo_owner=$(echo "$METADATA_YAML" | yq eval '.repository.owner' -)
          repo_name=$(echo "$METADATA_YAML" | yq eval '.repository.name' -)
          commit_sha=$(echo "$METADATA_YAML" | yq eval '.commit.sha_short' -)
          event_name=$(echo "$METADATA_YAML" | yq eval '.event.name' -)
          branch_name=$(echo "$METADATA_YAML" | yq eval '.ref.branch_name' -)

          {
            echo '## YAML Parsing Test'
            echo ''
            echo "- Repository Owner: $repo_owner"
            echo "- Repository Name: $repo_name"
            echo "- Commit SHA: $commit_sha"
            echo "- Event Name: $event_name"
            echo "- Branch Name: $branch_name"
            echo ''
            echo '✅ YAML parsing successful'
          } >> "$GITHUB_STEP_SUMMARY"
        # yamllint enable rule:line-length

      - name: 'Validate workflow run outputs'
        shell: bash
        env:
          METADATA_JSON: ${{ steps.metadata.outputs.metadata_json }}
          RUN_ID: ${{ steps.metadata.outputs.run_id }}
          RUN_ATTEMPT: ${{ steps.metadata.outputs.run_attempt }}
          RUN_NUMBER: ${{ steps.metadata.outputs.run_number }}
          WORKFLOW: ${{ steps.metadata.outputs.workflow }}
          WORKFLOW_REF: ${{ steps.metadata.outputs.workflow_ref }}
          JOB: ${{ steps.metadata.outputs.job }}
          RUN_URL: ${{ steps.metadata.outputs.run_url }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
          EXPECTED_RUN_NUMBER: ${{ github.run_number }}
          EXPECTED_WORKFLOW: ${{ github.workflow }}
          EXPECTED_WORKFLOW_REF: ${{ github.workflow_ref }}
          EXPECTED_JOB: ${{ github.job }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # Each output must match the run that produced it
          set -euo pipefail
          failed=0
          check() {
            if [ "$2" = "$3" ]; then
              echo "✅ $1: $2"
            else
              echo "❌ $1: expected '$3', got '$2'"
              failed=1
            fi
          }
          expected_url="${SERVER_URL}/${REPOSITORY}/actions/runs/${EXPECTED_RUN_ID}"
          if [ "$EXPECTED_RUN_ATTEMPT" -gt 1 ]; then
            expected_url="${expected_url}/attempts/${EXPECTED_RUN_ATTEMPT}"
          fi
          {
            echo '## Workflow Run Outputs'
            echo ''
            check run_id "$RUN_ID" "$EXPECTED_RUN_ID"
            check run_attempt "$RUN_ATTEMPT" "$EXPECTED_RUN_ATTEMPT"
            check run_number "$RUN_NUMBER" "$EXPECTED_RUN_NUMBER"
            check workflow "$WORKFLOW" "$EXPECTED_WORKFLOW"
            check workflow_ref "$WORKFLOW_REF" "$EXPECTED_WORKFLOW_REF"
            check job "$JOB" "$EXPECTED_JOB"
            check run_url "$RUN_URL" "$expected_url"
            check metadata_json.workflow_run.run_id \
              "$(echo "$METADATA_JSON" | jq -r '.workflow_run.run_id')" \
              "$EXPECTED_RUN_ID"
            check metadata_json.workflow_run.run_url \
              "$(echo "$METADATA_JSON" | jq -r '.workflow_run.run_url')" \
              "$expected_url"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$failed"

  # Test with a simulated tag push scenario
  test-tag-detection:
    name: 'Test tag detection logic'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      # Harden the runner used by this workflow
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        name: 'Harden runner'
        with:
          egress-policy: audit

      - name: 'Test tag detection with mock data'
        shell: bash
        # yamllint disable rule:line-length
        run: |
          # Test the tag detection logic directly
          {
            echo '## Tag Detection Test Results'
            echo ''

            # Test version tag pattern
            refs=("v1.0.0" "v2.1.3" "v10.20.30" "main" "feature/test" "v1.2" "1.0.0" "release-1.0")

            echo '| Ref Name | Matches Pattern | Expected |'
            echo '|----------|----------------|----------|'

          for ref in "${refs[@]}"; do
            if [[ "$ref" =~ ^v[0-9]+\.[0-9]+ ]]; then
              result="✅ true"
            else
              result="❌ false"
            fi

            # Determine expected result
            case "$ref" in
              v1.0.0|v2.1.3|v10.20.30|v1.2)
                expected="✅ true"
                ;;
              *)
                expected="❌ false"
                ;;
            esac

            echo "| $ref | $result | $expected |"
          done

            echo ''
            echo '✅ Tag detection pattern tested'
          } >> "$GITHUB_STEP_SUMMARY"
        # yamllint enable rule:line-length

  # Test cache key functionality
  test-cache-keys:
    name: 'Test cache key generation'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      # Harden the runner used by this workflow
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        name: 'Harden runner'
        with:
          egress-policy: audit

      - name: 'Get metadata'
        id: metadata
        uses: $/
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_summary: true

      - name: 'Test cache with generated keys'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/test
          key: ${{ steps.metadata.outputs.cache_key }}-test
          restore-keys: |
            ${{ steps.metadata.outputs.cache_restore_key }}-test

      - name: 'Validate cache keys'
        shell: bash
        # yamllint disable rule:line-length
        run: |
          {
            echo '## Cache Key Test'
            echo ''
            echo "✅ Cache key: ${STEPS_METADATA_OUTPUTS_CACHE_KEY}"
            echo "✅ Restore key: ${STEPS_METADATA_OUTPUTS_CACHE_RESTORE_KEY}"
            echo ''
            echo '✅ Cache keys successfully used with actions/cache'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          STEPS_METADATA_OUTPUTS_CACHE_KEY: ${{ steps.metadata.outputs.cache_key }}
          STEPS_METADATA_OUTPUTS_CACHE_RESTORE_KEY: ${{ steps.metadata.outputs.cache_restore_key }}
          # yamllint enable rule:line-length

  # Test artifact formats
  test-artifact-formats:
    name: 'Test artifact format options'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      # Harden the runner used by this workflow
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        name: 'Harden runner'
        with:
          egress-policy: audit

      - name: 'Test JSON-only artifacts'
        id: json-only
        uses: $/
        with:
          artifact_formats: json

      - name: 'Verify JSON-only artifact'
        shell: bash
        # yamllint disable rule:line-length
        run: |
          artifact_path="${STEPS_JSON_ONLY_OUTPUTS_ARTIFACT_PATH}"

          if [ ! -f "$artifact_path/repository-metadata.json" ]; then
            echo "❌ repository-metadata.json not found"
            exit 1
          fi

          if [ ! -f "$artifact_path/repository-metadata-pretty.json" ]; then
            echo "❌ repository-metadata-pretty.json not found"
            exit 1
          fi

          if [ -f "$artifact_path/repository-metadata.yaml" ]; then
            echo "❌ repository-metadata.yaml should not exist for json-only format"
            exit 1
          fi

          {
            echo '## JSON-Only Artifact Test'
            echo '✅ Only JSON files created'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          STEPS_JSON_ONLY_OUTPUTS_ARTIFACT_PATH: ${{ steps.json-only.outputs.artifact_path }}
          # yamllint enable rule:line-length

      - name: 'Test YAML-only artifacts'
        id: yaml-only
        uses: $/
        with:
          artifact_formats: yaml

      - name: 'Verify YAML-only artifact'
        shell: bash
        # yamllint disable rule:line-length
        run: |
          artifact_path="${STEPS_YAML_ONLY_OUTPUTS_ARTIFACT_PATH}"

          if [ -f "$artifact_path/repository-metadata.json" ]; then
            echo "❌ repository-metadata.json should not exist for yaml-only format"
            exit 1
          fi

          if [ -f "$artifact_path/repository-metadata-pretty.json" ]; then
            echo "❌ repository-metadata-pretty.json should not exist for yaml-only format"
            exit 1
          fi

          if [ ! -f "$artifact_path/repository-metadata.yaml" ]; then
            echo "❌ repository-metadata.yaml not found"
            exit 1
          fi

          {
            echo '## YAML-Only Artifact Test'
            echo '✅ Only YAML file created'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          STEPS_YAML_ONLY_OUTPUTS_ARTIFACT_PATH: ${{ steps.yaml-only.outputs.artifact_path }}
          # yamllint enable rule:line-length

      - name: 'Test both formats (default)'
        id: both-formats
        uses: $/
        with:
          artifact_formats: json,yaml

      - name: 'Verify both formats artifact'
        shell: bash
        # yamllint disable rule:line-length
        run: |
          artifact_path="${STEPS_BOTH_FORMATS_OUTPUTS_ARTIFACT_PATH}"

          if [ ! -f "$artifact_path/repository-metadata.json" ]; then
            echo "❌ repository-metadata.json not found"
            exit 1
          fi

          if [ ! -f "$artifact_path/repository-metadata-pretty.json" ]; then
            echo "❌ repository-metadata-pretty.json not found"
            exit 1
          fi

          if [ ! -f "$artifact_path/repository-metadata.yaml" ]; then
            echo "❌ repository-metadata.yaml not found"
            exit 1
          fi

          {
            echo '## Both Formats Artifact Test'
            echo '✅ All files created (JSON + YAML)'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          STEPS_BOTH_FORMATS_OUTPUTS_ARTIFACT_PATH: ${{ steps.both-formats.outputs.artifact_path }}
          # yamllint enable rule:line-length

  # setup-uv must not run an interpreter, or read uv settings, from the
  # caller's checkout. Plant a .venv, a .python-version and a uv.toml at
  # the workspace root whose interpreters record that they started.
  test-workspace-python-isolation:
    name: 'Test workspace Python files are not used'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # Required to read PR context for metadata extraction
    timeout-minutes: 5
    steps:
      # Harden the runner used by this workflow
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        name: 'Harden runner'
        with:
          egress-policy: audit

      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Required for changed files detection
          persist-credentials: false

      - name: 'Plant .venv and .python-version interpreters'
        shell: bash
        run: |
          # Each planted interpreter appends to the marker and exits 1
          set -euo pipefail
          marker="${RUNNER_TEMP}/planted-ran"
          rm -f "$marker"
          plant_exe() {
            printf '#!/bin/sh\necho "%s $*" >> "%s"\nexit 1\n' \
              "$2" "$marker" > "$1"
            chmod +x "$1"
          }
          mkdir -p .venv/bin
          printf 'home = /usr/bin\nversion = 3.12.0\n' > .venv/pyvenv.cfg
          plant_exe .venv/bin/python3 venv
          plant_exe .venv/bin/python venv
          plant_exe planted-pv-python python-version
          echo "${GITHUB_WORKSPACE}/planted-pv-python" > .python-version

      # Without a uv.toml, uv reaches interpreter discovery
      - name: 'Run action with planted interpreters'
        id: planted-venv
        uses: $/
        with:
          github_token: ${{ github.token }}
          artifact_upload: 'false'

      - name: 'Check no planted interpreter ran'
        shell: bash
        run: |
          # The marker exists only if a planted interpreter started
          if [ -e "${RUNNER_TEMP}/planted-ran" ]; then
            echo '❌ A planted workspace interpreter ran:'
            cat "${RUNNER_TEMP}/planted-ran"
            exit 1
          fi
          echo '✅ No planted interpreter ran'

      - name: 'Plant uv.toml'
        shell: bash
        run: |
          # setup-uv would install uv 0.0.1 and use this cache directory
          printf '%s\n' 'cache-dir = "/nonexistent/planted-cache"' \
            'required-version = "==0.0.1"' > uv.toml

      - name: 'Run action with planted interpreters and uv.toml'
        id: planted-all
        uses: $/
        with:
          github_token: ${{ github.token }}
          artifact_upload: 'false'

      - name: 'Validate outputs and marker'
        shell: bash
        env:
          # yamllint disable rule:line-length
          VENV_FULL_NAME: ${{ steps.planted-venv.outputs.repository_full_name }}
          VENV_COMMIT_SHA: ${{ steps.planted-venv.outputs.commit_sha }}
          VENV_METADATA_JSON: ${{ steps.planted-venv.outputs.metadata_json }}
          ALL_FULL_NAME: ${{ steps.planted-all.outputs.repository_full_name }}
          ALL_COMMIT_SHA: ${{ steps.planted-all.outputs.commit_sha }}
          ALL_METADATA_JSON: ${{ steps.planted-all.outputs.metadata_json }}
          # yamllint enable rule:line-length
        run: |
          # Both runs must produce real metadata and start no planted file
          set -euo pipefail
          status=0
          if [ -e "${RUNNER_TEMP}/planted-ran" ]; then
            echo '❌ A planted workspace interpreter ran:'
            cat "${RUNNER_TEMP}/planted-ran"
            status=1
          fi
          for run in VENV ALL; do
            full_name_var="${run}_FULL_NAME"
            sha_var="${run}_COMMIT_SHA"
            json_var="${run}_METADATA_JSON"
            if [ "${!full_name_var}" != "$GITHUB_REPOSITORY" ]; then
              echo "❌ ${run}: repository_full_name='${!full_name_var}'"
              status=1
            fi
            if [ "${!sha_var}" != "$GITHUB_SHA" ]; then
              echo "❌ ${run}: commit_sha='${!sha_var}'"
              status=1
            fi
            if ! printf '%s' "${!json_var}" | jq -e .repository >/dev/null
            then
              echo "❌ ${run}: metadata_json is not valid metadata"
              status=1
            fi
          done
          [ "$status" -eq 0 ] && echo '✅ Outputs valid; no planted file used'
          exit "$status"

  # A composite action inherits the caller job's environment. Export
  # hostile interpreter settings through GITHUB_ENV, the way code from
  # a caller's checkout could, and plant bait that records any start.
  test-caller-environment-isolation:
    name: 'Test caller environment isolation'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      pull-requests: read  # Required to read PR context for metadata extraction
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        selector: [request, active-environment]
    steps:
      # Harden the runner used by this workflow
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        name: 'Harden runner'
        with:
          egress-policy: audit

      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Required for changed files detection
          persist-credentials: false

      - name: 'Plant bait and hostile settings'
        shell: bash
        env:
          SELECTOR: ${{ matrix.selector }}
        run: |
          # Every bait appends to the marker when it starts or imports
          set -euo pipefail
          marker="${RUNNER_TEMP}/bait-ran"
          rm -f "$marker"
          ws="$GITHUB_WORKSPACE"
          plant_exe() {
            printf '#!/bin/sh\necho "%s $*" >> "%s"\nexit 1\n' \
              "$1" "$marker" > "$2"
            chmod +x "$2"
          }
          plant_module() {
            mkdir -p "$(dirname "$2")"
            printf 'with open(%s, "a") as f:\n    f.write("%s\\n")\n' \
              "'$marker'" "module $1" > "$2"
          }
          mkdir -p .venv/bin .venv/conda-meta xdg-bin pkg pyhome userbase
          for name in python python3 python3.13 uv; do
            plant_exe "venv $name" ".venv/bin/$name"
          done
          printf 'home = /usr/bin\nversion = 3.13.0\n' > .venv/pyvenv.cfg
          for name in env bash; do
            plant_exe "xdg $name" "xdg-bin/$name"
          done
          for dir in . pkg; do
            for mod in json base64 sitecustomize usercustomize; do
              plant_module "$mod" "$dir/$mod.py"
            done
            plant_module urllib "$dir/urllib/__init__.py"
          done
          plant_module startup startup.py

          case "$RUNNER_ARCH" in
            ARM64) arch=aarch64 ;;
            *) arch=x86_64 ;;
          esac
          # The runner puts GITHUB_PATH entries ahead of PATH, so this
          # puts the bait first, as a caller's earlier step could
          echo "$ws/.venv/bin" >> "$GITHUB_PATH"
          {
            echo 'PYTHONPATH=pkg:.'
            echo "PYTHONHOME=$ws/pyhome"
            echo "PYTHONUSERBASE=$ws/userbase"
            echo "PYTHONSTARTUP=$ws/startup.py"
            echo "PYTHONEXECUTABLE=$ws/.venv/bin/python"
            echo "__PYVENV_LAUNCHER__=$ws/.venv/bin/python"
            echo 'UV_NO_CACHE=1'
            echo "UV_PYTHON_ARCH=$arch"
            echo 'UV_PYTHON_INSTALL_MIRROR=https://127.0.0.1:9'
            echo "XDG_BIN_HOME=$ws/xdg-bin"
            if [ "$SELECTOR" = request ]; then
              echo "UV_PYTHON=$ws/.venv/bin/python"
              echo "UV_PYTHON_SEARCH_PATH=$ws/.venv/bin"
              echo "UV_PYTHON_INSTALL_DIR=$ws/uv-python"
              echo 'UV_PYTHON_PREFERENCE=only-system'
            else
              # UV_PYTHON stays unset so it cannot mask this discovery
              echo "VIRTUAL_ENV=$ws/.venv"
              echo "CONDA_PREFIX=$ws/.venv"
              echo 'CONDA_DEFAULT_ENV=base'
              echo "UV_INTERNAL__PARENT_INTERPRETER=$ws/.venv/bin/python"
              echo 'UV_INTERNAL__TEST_PYTHON_MANAGED=1'
              echo "UV_CACHE_DIR=$ws/uv-cache"
            fi
          } >> "$GITHUB_ENV"

      - name: 'Control: prove the bait is live'
        shell: bash
        run: |
          # A Python that is not isolated must trip the bait. The bait
          # exits 1 and steps run under bash -e, hence "|| true"; the
          # marker checks below decide the result. The real interpreter
          # is named by absolute path: command -v would return the bait.
          set -euo pipefail
          marker="${RUNNER_TEMP}/bait-ran"
          python3 -c pass || true
          env -u PYTHONHOME -u PYTHONEXECUTABLE -u __PYVENV_LAUNCHER__ \
            /usr/bin/python3 -c 'import json' || true
          status=0
          for want in 'venv python3' 'module json'; do
            if ! grep -q "^$want" "$marker" 2>/dev/null; then
              echo "❌ Control did not trip bait: $want"
              status=1
            fi
          done
          [ "$status" -eq 0 ] || exit 1
          rm -f "$marker"
          echo '✅ Bait is live'

      # An explicit base resolves the detector's verdict on every event
      - name: 'Choose the dependency change base'
        id: dc-base
        shell: bash
        run: |
          # The commit before HEAD; fetch-depth 0 makes it present
          set -euo pipefail
          echo "base=$(git rev-parse HEAD^)" >> "$GITHUB_OUTPUT"

      - name: 'Run action (cold)'
        id: cold
        uses: $/
        with:
          github_token: ${{ github.token }}
          artifact_upload: 'false'
          dependency_change: 'true'
          dependency_base: ${{ steps.dc-base.outputs.base }}

      - name: 'Run action (warm)'
        id: warm
        uses: $/
        with:
          github_token: ${{ github.token }}
          artifact_upload: 'false'
          dependency_change: 'true'
          dependency_base: ${{ steps.dc-base.outputs.base }}

      - name: 'Verify no bait ran and outputs are valid'
        shell: bash
        env:
          SIDECAR: '.repository-metadata-dependency-change.json'
          WANT_BASE: ${{ steps.dc-base.outputs.base }}
          COLD_FULL_NAME: ${{ steps.cold.outputs.repository_full_name }}
          COLD_COMMIT_SHA: ${{ steps.cold.outputs.commit_sha }}
          COLD_METADATA_JSON: ${{ steps.cold.outputs.metadata_json }}
          COLD_CHANGED: ${{ steps.cold.outputs.dependencies_changed }}
          COLD_REASON: ${{ steps.cold.outputs.dependency_change_reason }}
          COLD_BASE: ${{ steps.cold.outputs.dependency_change_base }}
          WARM_FULL_NAME: ${{ steps.warm.outputs.repository_full_name }}
          WARM_COMMIT_SHA: ${{ steps.warm.outputs.commit_sha }}
          WARM_METADATA_JSON: ${{ steps.warm.outputs.metadata_json }}
          WARM_CHANGED: ${{ steps.warm.outputs.dependencies_changed }}
          WARM_REASON: ${{ steps.warm.outputs.dependency_change_reason }}
          WARM_BASE: ${{ steps.warm.outputs.dependency_change_base }}
        run: |
          # Both runs must produce real metadata and start no bait
          set -euo pipefail
          status=0
          if [ -e "${RUNNER_TEMP}/bait-ran" ]; then
            echo '❌ Bait ran:'
            cat "${RUNNER_TEMP}/bait-ran"
            status=1
          fi
          case ":$PATH:" in
            *":$GITHUB_WORKSPACE/xdg-bin:"*)
              echo '❌ The caller XDG_BIN_HOME directory is on PATH'
              status=1 ;;
          esac
          for run in COLD WARM; do
            full_name_var="${run}_FULL_NAME"
            sha_var="${run}_COMMIT_SHA"
            json_var="${run}_METADATA_JSON"
            if [ "${!full_name_var}" != "$GITHUB_REPOSITORY" ]; then
              echo "❌ ${run}: repository_full_name='${!full_name_var}'"
              status=1
            fi
            if [ "${!sha_var}" != "$GITHUB_SHA" ]; then
              echo "❌ ${run}: commit_sha='${!sha_var}'"
              status=1
            fi
            if ! printf '%s' "${!json_var}" | jq -e .repository >/dev/null
            then
              echo "❌ ${run}: metadata_json is not valid metadata"
              status=1
            fi
            # The detector ran under the trusted interpreter and resolved
            changed_var="${run}_CHANGED"
            reason_var="${run}_REASON"
            base_var="${run}_BASE"
            echo "${run}: changed='${!changed_var}' reason='${!reason_var}'"
            case "${!changed_var}" in
              true|false) ;;
              *) echo "❌ ${run}: dependencies_changed is not resolved"
                 status=1 ;;
            esac
            if [ "${!base_var}" != "$WANT_BASE" ]; then
              echo "❌ ${run}: dependency_change_base='${!base_var}'"
              status=1
            fi
          done
          if [ -e "$SIDECAR" ]; then
            echo '❌ Sidecar left in the workspace'
            status=1
          fi
          [ "$status" -eq 0 ] && echo '✅ Outputs valid; no bait ran'
          exit "$status"

  # The detector runs "git" from PATH. Plant a git in the workspace, put
  # it first on PATH as a caller's earlier step could, and check that
  # the action skips detection rather than run it. The swapped leg
  # reaches the workspace through a differently cased spelling, which
  # names the same directory on macOS's case-insensitive volume. The
  # fallback leg puts a git that cannot start, outside the workspace,
  # ahead of the planted one: Python's subprocess, which the detector
  # uses, then moves on to the planted git.
  test-untrusted-git:
    name: 'Test untrusted git skips detection'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        variant: [exact, fallback]
        include:
          - os: macos-15
            variant: swapped
    steps:
      # Harden the runner used by this workflow
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        name: 'Harden runner'
        with:
          egress-policy: audit

      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # The explicit base must be present
          persist-credentials: false

      - name: 'Plant an untrusted git'
        id: plant
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          # The planted git records that it ran and prints nothing
          set -euo pipefail
          marker="${RUNNER_TEMP}/planted-git-ran"
          rm -f "$marker"
          real_git="$(command -v git)"
          echo "base=$(git rev-parse HEAD^)" >> "$GITHUB_OUTPUT"
          mkdir -p planted-git
          printf '#!/bin/sh\necho "git $*" >> "%s"\nexit 0\n' "$marker" \
            > planted-git/git
          chmod +x planted-git/git
          workspace="$GITHUB_WORKSPACE"
          if [ "$VARIANT" = swapped ]; then
            workspace="$(printf '%s' "$GITHUB_WORKSPACE" \
              | tr '[:lower:]' '[:upper:]')"
            # Control: another spelling of the same directory
            if [ "$workspace" = "$GITHUB_WORKSPACE" ] \
              || [ ! "$workspace" -ef "$GITHUB_WORKSPACE" ]; then
              echo "❌ '$workspace' is not another spelling of the workspace"
              exit 1
            fi
          fi
          echo "dir=${workspace}/planted-git" >> "$GITHUB_OUTPUT"
          echo "${workspace}/planted-git" >> "$GITHUB_PATH"
          if [ "$VARIANT" = fallback ]; then
            # Added last, so first on PATH: its interpreter is missing
            broken="${HOME}/broken-git"
            mkdir -p "$broken"
            printf '#!/nonexistent/interpreter\n' > "${broken}/git"
            chmod +x "${broken}/git"
            echo "broken=${broken}" >> "$GITHUB_OUTPUT"
            echo "$broken" >> "$GITHUB_PATH"
          fi
          # The metadata step's GitPython and the package build's
          # setuptools-scm also run git; this test is about the
          # detector, so point those two elsewhere.
          {
            echo "GIT_PYTHON_GIT_EXECUTABLE=${real_git}"
            echo 'SETUPTOOLS_SCM_PRETEND_VERSION=0.0.0'
          } >> "$GITHUB_ENV"

      - name: 'Control: prove the planted git is reachable on PATH'
        shell: bash
        env:
          PLANTED_DIR: ${{ steps.plant.outputs.dir }}
          BROKEN_DIR: ${{ steps.plant.outputs.broken }}
        run: |
          # command -v must find the planted git, spelled as planted,
          # or in the fallback leg the broken git ahead of it
          set -euo pipefail
          want="${PLANTED_DIR}/git"
          [ -z "$BROKEN_DIR" ] || want="${BROKEN_DIR}/git"
          found="$(command -v git)"
          if [ "$found" != "$want" ]; then
            echo "❌ git resolves to '$found'"
            exit 1
          fi
          if [ -n "$BROKEN_DIR" ]; then
            if "${BROKEN_DIR}/git" --version 2>/dev/null; then
              echo '❌ The broken git started'
              exit 1
            fi
            # Python's subprocess moves on to the planted git
            marker="${RUNNER_TEMP}/planted-git-ran"
            python3 -c 'import subprocess; subprocess.run(["git", "x"])'
            if [ ! -e "$marker" ]; then
              echo '❌ subprocess did not fall back to the planted git'
              exit 1
            fi
            rm -f "$marker"
            echo '✅ A failed git start falls back to the planted git'
          fi
          echo '✅ The planted git is reachable on PATH'

      - name: 'Run action with the planted git on PATH'
        id: planted
        uses: $/
        with:
          artifact_upload: 'false'
          dependency_change: 'true'
          dependency_base: ${{ steps.plant.outputs.base }}

      - name: 'Check detection was skipped'
        shell: bash
        env:
          SIDECAR: '.repository-metadata-dependency-change.json'
          CHANGED: ${{ steps.planted.outputs.dependencies_changed }}
          REASON: ${{ steps.planted.outputs.dependency_change_reason }}
          BASE: ${{ steps.planted.outputs.dependency_change_base }}
        run: |
          # Unresolved, naming git, and the planted git never ran
          set -euo pipefail
          echo "changed='$CHANGED' base='$BASE' reason='$REASON'"
          status=0
          if [ -e "${RUNNER_TEMP}/planted-git-ran" ]; then
            echo '❌ The planted git ran:'
            cat "${RUNNER_TEMP}/planted-git-ran"
            status=1
          fi
          if [ -n "${CHANGED}${BASE}" ]; then
            echo '❌ Expected an unresolved result'
            status=1
          fi
          case "$REASON" in
            unresolved*git*) ;;
            *) echo '❌ Reason does not name git'; status=1 ;;
          esac
          if [ -e "$SIDECAR" ]; then
            echo '❌ Sidecar left in the workspace'
            status=1
          fi
          [ "$status" -eq 0 ] && echo '✅ Untrusted git skipped detection'
          exit "$status"

  # Dependency change detection against this run's own event
  test-dependency-change-event:
    name: 'Test dependency change detection (event)'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    env:
      SIDECAR: '.repository-metadata-dependency-change.json'
    steps:
      # Harden the runner used by this workflow
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        name: 'Harden runner'
        with:
          egress-policy: audit

      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # The detector needs the base commit
          persist-credentials: false

      - name: 'Run action with detection off'
        id: dc-off
        uses: $/
        with:
          artifact_upload: 'false'

      - name: 'Check detection off'
        shell: bash
        env:
          CHANGED: ${{ steps.dc-off.outputs.dependencies_changed }}
          REASON: ${{ steps.dc-off.outputs.dependency_change_reason }}
          BASE: ${{ steps.dc-off.outputs.dependency_change_base }}
        run: |
          # Off by default: no outputs and no sidecar
          set -euo pipefail
          if [ -n "${CHANGED}${REASON}${BASE}" ]; then
            echo "❌ Outputs set: '$CHANGED' '$REASON' '$BASE'"
            exit 1
          fi
          if [ -e "$SIDECAR" ]; then
            echo "❌ Sidecar left in the workspace"
            exit 1
          fi
          echo '✅ Detection off leaves outputs empty'

      - name: 'Run action with detection on'
        id: dc-run
        uses: $/
        with:
          artifact_upload: 'false'
          dependency_change: 'true'

      - name: 'Check detection on this run'
        shell: bash
        env:
          CHANGED: ${{ steps.dc-run.outputs.dependencies_changed }}
          REASON: ${{ steps.dc-run.outputs.dependency_change_reason }}
          BASE: ${{ steps.dc-run.outputs.dependency_change_base }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          # The verdict depends on the event that started this run
          set -euo pipefail
          echo "changed='$CHANGED' base='$BASE' reason='$REASON'"
          if [ -e "$SIDECAR" ]; then
            echo "❌ Sidecar left in the workspace"
            exit 1
          fi
          if [ -z "$REASON" ]; then
            echo '❌ dependency_change_reason is empty'
            exit 1
          fi
          resolved=false
          case "$GITHUB_EVENT_NAME" in
            pull_request) resolved=true ;;
            push)
              case "$EVENT_BEFORE" in
                ''|*[!0]*) resolved=true ;;
              esac ;;
          esac
          if [ "$resolved" = true ]; then
            case "$CHANGED" in
              true|false) ;;
              *) echo "❌ Expected true or false, got '$CHANGED'"; exit 1 ;;
            esac
            if [ -z "$BASE" ]; then
              echo '❌ dependency_change_base is empty'
              exit 1
            fi
          else
            if [ -n "${CHANGED}${BASE}" ]; then
              echo "❌ Expected an unresolved result"
              exit 1
            fi
            case "$REASON" in
              unresolved*) ;;
              *) echo "❌ Reason does not start with unresolved"; exit 1 ;;
            esac
          fi
          echo '✅ Detection on this run behaves as expected'

      - name: 'Plant a file at the sidecar path'
        shell: bash
        run: |
          # The action must leave this file exactly as it finds it
          set -euo pipefail
          printf 'planted\n{"changed": false}\n' > "$SIDECAR"
          cp -- "$SIDECAR" "${RUNNER_TEMP}/planted-sidecar"

      - name: 'Run action with the sidecar path occupied'
        id: dc-occupied
        uses: $/
        with:
          artifact_upload: 'false'
          dependency_change: 'true'

      - name: 'Check occupied sidecar path'
        shell: bash
        env:
          CHANGED: ${{ steps.dc-occupied.outputs.dependencies_changed }}
          REASON: ${{ steps.dc-occupied.outputs.dependency_change_reason }}
          BASE: ${{ steps.dc-occupied.outputs.dependency_change_base }}
        run: |
          # Unresolved, and the planted file survives byte for byte
          set -euo pipefail
          echo "changed='$CHANGED' base='$BASE' reason='$REASON'"
          if ! cmp -- "$SIDECAR" "${RUNNER_TEMP}/planted-sidecar"; then
            echo '❌ The planted file changed or vanished'
            exit 1
          fi
          if [ -n "${CHANGED}${BASE}" ]; then
            echo '❌ Expected an unresolved result'
            exit 1
          fi
          case "$REASON" in
            unresolved*"$SIDECAR"*) ;;
            *) echo '❌ Reason does not name the occupied path'; exit 1 ;;
          esac
          rm -f -- "$SIDECAR"
          echo '✅ Occupied sidecar path left alone'

      - name: 'Run action with an invalid dependency_change'
        id: dc-invalid
        continue-on-error: true
        uses: $/
        with:
          artifact_upload: 'false'
          dependency_change: 'yes'

      - name: 'Check invalid input fails'
        shell: bash
        env:
          OUTCOME: ${{ steps.dc-invalid.outcome }}
        run: |
          # An invalid opt-in fails the step loudly
          set -euo pipefail
          if [ "$OUTCOME" != 'failure' ]; then
            echo "❌ Expected failure, got '$OUTCOME'"
            exit 1
          fi
          if [ -e "$SIDECAR" ]; then
            echo "❌ Sidecar left in the workspace"
            exit 1
          fi
          echo '✅ Invalid dependency_change failed the step'

  # Deterministic verdicts from scratch commits and explicit bases
  test-dependency-change-verdicts:
    name: 'Test dependency change detection (verdicts)'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    env:
      SIDECAR: '.repository-metadata-dependency-change.json'
      SCRATCH_DIR: 'dependency-change-scratch'
    steps:
      # Harden the runner used by this workflow
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        name: 'Harden runner'
        with:
          egress-policy: audit

      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Required for changed files detection
          persist-credentials: false

      # A new directory keeps the action's own pyproject.toml and
      # uv.lock untouched: the action installs itself from them.
      - name: 'Commit a package.json'
        id: commit-package
        shell: bash
        run: |
          # Add a node manifest in a new directory
          set -euo pipefail
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          mkdir -p "$SCRATCH_DIR"
          echo '{}' > "$SCRATCH_DIR/package.json"
          git add -- "$SCRATCH_DIR/package.json"
          git -c user.name='Test' -c user.email='test@example.invalid' \
            commit -q --no-gpg-sign -m 'Test: Add package.json'

      - name: 'Run action against the package.json commit'
        id: dc-package
        uses: $/
        with:
          artifact_upload: 'false'
          dependency_change: 'true'
          dependency_base: ${{ steps.commit-package.outputs.base }}

      - name: 'Check package.json verdict'
        shell: bash
        env:
          WANT_BASE: ${{ steps.commit-package.outputs.base }}
          CHANGED: ${{ steps.dc-package.outputs.dependencies_changed }}
          REASON: ${{ steps.dc-package.outputs.dependency_change_reason }}
          BASE: ${{ steps.dc-package.outputs.dependency_change_base }}
        run: |
          # Every preset applies by default, so node matches
          set -euo pipefail
          echo "changed='$CHANGED' base='$BASE' reason='$REASON'"
          [ ! -e "$SIDECAR" ] || { echo '❌ Sidecar left'; exit 1; }
          [ "$CHANGED" = true ] || { echo '❌ Expected true'; exit 1; }
          [ "$BASE" = "$WANT_BASE" ] || { echo '❌ Wrong base'; exit 1; }
          echo '✅ package.json counts as a dependency change'

      - name: 'Run action with only the python preset'
        id: dc-narrowed
        uses: $/
        with:
          artifact_upload: 'false'
          dependency_change: 'true'
          dependency_ecosystems: 'python'
          dependency_base: ${{ steps.commit-package.outputs.base }}

      - name: 'Check narrowed verdict'
        shell: bash
        env:
          WANT_BASE: ${{ steps.commit-package.outputs.base }}
          CHANGED: ${{ steps.dc-narrowed.outputs.dependencies_changed }}
          REASON: ${{ steps.dc-narrowed.outputs.dependency_change_reason }}
          BASE: ${{ steps.dc-narrowed.outputs.dependency_change_base }}
        run: |
          # The python preset does not match package.json
          set -euo pipefail
          echo "changed='$CHANGED' base='$BASE' reason='$REASON'"
          [ ! -e "$SIDECAR" ] || { echo '❌ Sidecar left'; exit 1; }
          [ "$CHANGED" = false ] || { echo '❌ Expected false'; exit 1; }
          [ "$BASE" = "$WANT_BASE" ] || { echo '❌ Wrong base'; exit 1; }
          echo '✅ Narrowed presets ignore package.json'

      - name: 'Commit a plain text file'
        id: commit-text
        shell: bash
        run: |
          # Add a file no preset matches
          set -euo pipefail
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          mkdir -p "$SCRATCH_DIR"
          echo 'notes' > "$SCRATCH_DIR/notes.txt"
          git add -- "$SCRATCH_DIR/notes.txt"
          git -c user.name='Test' -c user.email='test@example.invalid' \
            commit -q --no-gpg-sign -m 'Test: Add notes'

      - name: 'Run action against the text file commit'
        id: dc-text
        uses: $/
        with:
          artifact_upload: 'false'
          dependency_change: 'true'
          dependency_base: ${{ steps.commit-text.outputs.base }}

      - name: 'Check text file verdict'
        shell: bash
        env:
          WANT_BASE: ${{ steps.commit-text.outputs.base }}
          CHANGED: ${{ steps.dc-text.outputs.dependencies_changed }}
          REASON: ${{ steps.dc-text.outputs.dependency_change_reason }}
          BASE: ${{ steps.dc-text.outputs.dependency_change_base }}
        run: |
          # A plain text file is not a dependency file
          set -euo pipefail
          echo "changed='$CHANGED' base='$BASE' reason='$REASON'"
          [ ! -e "$SIDECAR" ] || { echo '❌ Sidecar left'; exit 1; }
          [ "$CHANGED" = false ] || { echo '❌ Expected false'; exit 1; }
          [ "$BASE" = "$WANT_BASE" ] || { echo '❌ Wrong base'; exit 1; }
          echo '✅ A plain text file is not a dependency change'

      # dependency-change-action v0.1.0 added these to the maven and
      # gradle presets; v0.0.1 reports false for both commits below.
      - name: 'Commit a Maven jvm.config'
        id: commit-maven
        shell: bash
        run: |
          # Add .mvn/jvm.config at the root, where Maven reads it
          set -euo pipefail
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          mkdir -p .mvn
          echo '-Xmx1g' > .mvn/jvm.config
          git add -- .mvn/jvm.config
          git -c user.name='Test' -c user.email='test@example.invalid' \
            commit -q --no-gpg-sign -m 'Test: Add jvm.config'

      - name: 'Run action against the jvm.config commit'
        id: dc-maven
        uses: $/
        with:
          artifact_upload: 'false'
          dependency_change: 'true'
          dependency_base: ${{ steps.commit-maven.outputs.base }}

      - name: 'Run action against jvm.config with the maven preset'
        id: dc-maven-only
        uses: $/
        with:
          artifact_upload: 'false'
          dependency_change: 'true'
          dependency_ecosystems: 'maven'
          dependency_base: ${{ steps.commit-maven.outputs.base }}

      - name: 'Check jvm.config verdicts'
        shell: bash
        env:
          WANT_BASE: ${{ steps.commit-maven.outputs.base }}
          ALL_CHANGED: ${{ steps.dc-maven.outputs.dependencies_changed }}
          ALL_REASON: ${{ steps.dc-maven.outputs.dependency_change_reason }}
          ALL_BASE: ${{ steps.dc-maven.outputs.dependency_change_base }}
          ONE_CHANGED: ${{ steps.dc-maven-only.outputs.dependencies_changed }}
          # yamllint disable-line rule:line-length
          ONE_REASON: ${{ steps.dc-maven-only.outputs.dependency_change_reason }}
          ONE_BASE: ${{ steps.dc-maven-only.outputs.dependency_change_base }}
        run: |
          # The maven preset matches .mvn/jvm.config from v0.1.0
          set -euo pipefail
          for run in ALL ONE; do
            changed_var="${run}_CHANGED"
            reason_var="${run}_REASON"
            base_var="${run}_BASE"
            echo "${run}: changed='${!changed_var}'" \
              "base='${!base_var}' reason='${!reason_var}'"
            [ "${!changed_var}" = true ] \
              || { echo "❌ ${run}: Expected true"; exit 1; }
            [ "${!base_var}" = "$WANT_BASE" ] \
              || { echo "❌ ${run}: Wrong base"; exit 1; }
          done
          [ ! -e "$SIDECAR" ] || { echo '❌ Sidecar left'; exit 1; }
          echo '✅ .mvn/jvm.config counts as a dependency change'

      - name: 'Commit an applied Gradle script'
        id: commit-gradle
        shell: bash
        run: |
          # Add a script a build file would pull in with "apply from"
          set -euo pipefail
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          mkdir -p gradle
          echo 'ext.versions = [:]' > gradle/deps.gradle
          git add -- gradle/deps.gradle
          git -c user.name='Test' -c user.email='test@example.invalid' \
            commit -q --no-gpg-sign -m 'Test: Add deps.gradle'

      - name: 'Run action against the Gradle script commit'
        id: dc-gradle
        uses: $/
        with:
          artifact_upload: 'false'
          dependency_change: 'true'
          dependency_base: ${{ steps.commit-gradle.outputs.base }}

      - name: 'Run action against the Gradle script with the gradle preset'
        id: dc-gradle-only
        uses: $/
        with:
          artifact_upload: 'false'
          dependency_change: 'true'
          dependency_ecosystems: 'gradle'
          dependency_base: ${{ steps.commit-gradle.outputs.base }}

      - name: 'Check Gradle script verdicts'
        shell: bash
        env:
          WANT_BASE: ${{ steps.commit-gradle.outputs.base }}
          ALL_CHANGED: ${{ steps.dc-gradle.outputs.dependencies_changed }}
          ALL_REASON: ${{ steps.dc-gradle.outputs.dependency_change_reason }}
          ALL_BASE: ${{ steps.dc-gradle.outputs.dependency_change_base }}
          ONE_CHANGED: ${{ steps.dc-gradle-only.outputs.dependencies_changed }}
          # yamllint disable-line rule:line-length
          ONE_REASON: ${{ steps.dc-gradle-only.outputs.dependency_change_reason }}
          ONE_BASE: ${{ steps.dc-gradle-only.outputs.dependency_change_base }}
        run: |
          # The gradle preset matches *.gradle scripts from v0.1.0
          set -euo pipefail
          for run in ALL ONE; do
            changed_var="${run}_CHANGED"
            reason_var="${run}_REASON"
            base_var="${run}_BASE"
            echo "${run}: changed='${!changed_var}'" \
              "base='${!base_var}' reason='${!reason_var}'"
            [ "${!changed_var}" = true ] \
              || { echo "❌ ${run}: Expected true"; exit 1; }
            [ "${!base_var}" = "$WANT_BASE" ] \
              || { echo "❌ ${run}: Wrong base"; exit 1; }
          done
          [ ! -e "$SIDECAR" ] || { echo '❌ Sidecar left'; exit 1; }
          echo '✅ An applied Gradle script counts as a dependency change'

      # A replace ref swaps one object for another wherever git reads
      # it. Replacing the commit with its parent makes it diff as empty.
      - name: 'Commit a package.json and replace it with its parent'
        id: commit-replaced
        shell: bash
        run: |
          # Add a node manifest, then plant a replace ref that hides it
          set -euo pipefail
          base="$(git rev-parse HEAD)"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          mkdir -p "$SCRATCH_DIR/replaced"
          echo '{}' > "$SCRATCH_DIR/replaced/package.json"
          git add -- "$SCRATCH_DIR/replaced/package.json"
          git -c user.name='Test' -c user.email='test@example.invalid' \
            commit -q --no-gpg-sign -m 'Test: Add replaced package.json'
          head="$(git rev-parse HEAD)"
          git replace "$head" "$base"
          # Control: with replace refs honoured, the commit is empty
          if [ -n "$(git diff --name-only "$base" "$head")" ]; then
            echo '❌ The replace ref did not hide the change'
            exit 1
          fi
          echo '✅ The replace ref hides the change from plain git'

      - name: 'Run action against the replaced commit'
        id: dc-replaced
        uses: $/
        with:
          artifact_upload: 'false'
          dependency_change: 'true'
          dependency_base: ${{ steps.commit-replaced.outputs.base }}

      - name: 'Check replaced commit verdict'
        shell: bash
        env:
          WANT_BASE: ${{ steps.commit-replaced.outputs.base }}
          CHANGED: ${{ steps.dc-replaced.outputs.dependencies_changed }}
          REASON: ${{ steps.dc-replaced.outputs.dependency_change_reason }}
          BASE: ${{ steps.dc-replaced.outputs.dependency_change_base }}
        run: |
          # The detector ignores replace refs and sees the real commit
          set -euo pipefail
          echo "changed='$CHANGED' base='$BASE' reason='$REASON'"
          git replace -d "$(git rev-parse HEAD)"
          [ ! -e "$SIDECAR" ] || { echo '❌ Sidecar left'; exit 1; }
          [ "$CHANGED" = true ] || { echo '❌ Expected true'; exit 1; }
          [ "$BASE" = "$WANT_BASE" ] || { echo '❌ Wrong base'; exit 1; }
          echo '✅ A replace ref does not hide a dependency change'

      # A grafts file rewrites a commit's parents, so HEAD^1 names
      # another commit. Graft a text-only commit onto the checkout's
      # own commit: honoured, HEAD^1 would span every scratch commit
      # above, dependency files included.
      - name: 'Commit a text file and graft it onto an older commit'
        id: commit-grafted
        shell: bash
        env:
          OLDER: ${{ steps.commit-package.outputs.base }}
        run: |
          # Add a file no preset matches, then plant .git/info/grafts
          set -euo pipefail
          parent="$(git rev-parse HEAD)"
          echo "parent=$parent" >> "$GITHUB_OUTPUT"
          mkdir -p "$SCRATCH_DIR"
          echo 'grafted' > "$SCRATCH_DIR/grafted.txt"
          git add -- "$SCRATCH_DIR/grafted.txt"
          git -c user.name='Test' -c user.email='test@example.invalid' \
            commit -q --no-gpg-sign -m 'Test: Add grafted notes'
          head="$(git rev-parse HEAD)"
          grafts="$(git rev-parse --git-path info/grafts)"
          mkdir -p "$(dirname "$grafts")"
          echo "$head $OLDER" > "$grafts"
          # Control: with grafts honoured, HEAD^1 is the older commit
          if [ "$(git rev-parse HEAD^1 2>/dev/null)" != "$OLDER" ]; then
            echo '❌ The grafts file did not move HEAD^1'
            exit 1
          fi
          echo '✅ The grafts file moves HEAD^1 for plain git'

      # The base is the ref HEAD^1, which a grafts file can move; the
      # true parent is the commit made just before the text file.
      - name: 'Run action against the grafted commit'
        id: dc-grafted
        uses: $/
        with:
          artifact_upload: 'false'
          dependency_change: 'true'
          dependency_base: 'HEAD^1'

      - name: 'Check grafted commit verdict'
        shell: bash
        env:
          WANT_BASE: ${{ steps.commit-grafted.outputs.parent }}
          CHANGED: ${{ steps.dc-grafted.outputs.dependencies_changed }}
          REASON: ${{ steps.dc-grafted.outputs.dependency_change_reason }}
          BASE: ${{ steps.dc-grafted.outputs.dependency_change_base }}
        run: |
          # The detector ignores grafts: the true parent, a text change
          set -euo pipefail
          echo "changed='$CHANGED' base='$BASE' reason='$REASON'"
          rm -f -- "$(git rev-parse --git-path info/grafts)"
          [ ! -e "$SIDECAR" ] || { echo '❌ Sidecar left'; exit 1; }
          [ "$CHANGED" = false ] || { echo '❌ Expected false'; exit 1; }
          [ "$BASE" = "$WANT_BASE" ] || { echo '❌ Wrong base'; exit 1; }
          echo '✅ A grafts file does not move the base'
