---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2025 The Linux Foundation

# repository-metadata-action
name: '🛠️ Repository Metadata'
description: 'Gathers repository metadata'
# Also prints a summary of various GitHub environment variables to the console

inputs:
  # Optional
  github_token:
    # Not mandatory; uses git diff when token not provided
    description: 'GitHub token for API access'
    required: false
    default: ''
  debug:
    description: 'Enable debug mode for verbose output'
    required: false
    default: 'false'
  github_summary:
    description: >-
      Generate GitHub execution environment summary in GITHUB_STEP_SUMMARY
    required: false
    default: 'false'
  artifact_upload:
    description: >-
      Upload metadata as a workflow artifact (JSON/YAML formats)
    required: false
    default: 'true'
  artifact_formats:
    description: >-
      Comma-separated list of formats to upload (json, yaml)
    required: false
    default: 'json,yaml'
  change_detection:
    description: >-
      Changed files detection method: 'git' or 'github_api'
      (defaults to 'github_api' when token provided, 'git' otherwise)
    required: false
    default: ''
  git_fetch_depth:
    description: >-
      Depth for git fetch --deepen when shallow clone needs more history
    required: false
    default: '15'
  gerrit_summary:
    description: >-
      Generate Gerrit parameters summary in GITHUB_STEP_SUMMARY
    required: false
    default: 'true'
  files_summary:
    description: >-
      Generate changed files summary in GITHUB_STEP_SUMMARY
    required: false
    default: 'false'
  gerrit_include_comment:
    description: >-
      Include Gerrit comment in summaries and JSON/YAML outputs
      (may contain sensitive data; use with care)
    required: false
    default: 'false'
  dependency_change:
    description: >-
      Detect whether the change touched dependency files: 'true' or 'false'
    required: false
    default: 'false'
  dependency_ecosystems:
    description: >-
      Comma-separated dependency-change-action presets; empty means every
      preset
    required: false
    default: ''
  dependency_patterns:
    description: >-
      Extra dependency file patterns, one per line, added to the presets
    required: false
    default: ''
  dependency_path_prefix:
    description: 'Project directory within the repository'
    required: false
    default: '.'
  gerrit_refspec:
    description: >-
      Set when the caller's checkout is a Gerrit change; the base is then
      the change's parent
    required: false
    default: ''
  dependency_base:
    description: >-
      Explicit base commit for dependency change detection, overriding
      event detection
    required: false
    default: ''

outputs:
  # Repository outputs
  repository_owner:
    description: 'Returns the name of the GitHub organization'
    value: ${{ steps.metadata.outputs.repository_owner }}
  repository_name:
    description: 'Returns the name of the GitHub repository'
    value: ${{ steps.metadata.outputs.repository_name }}
  repository_full_name:
    description: 'Returns the full repository name (owner/name)'
    value: ${{ steps.metadata.outputs.repository_full_name }}
  is_public:
    description: 'Returns true if the repository is public'
    value: ${{ steps.metadata.outputs.is_public }}
  is_private:
    description: 'Returns true if the repository is private'
    value: ${{ steps.metadata.outputs.is_private }}

  # Event type detection outputs
  tag_push_event:
    description: 'Returns true if the event was triggered by a version tag push'
    value: ${{ steps.metadata.outputs.tag_push_event }}
  is_tag_push:
    description: 'Returns true if the event is a tag push'
    value: ${{ steps.metadata.outputs.is_tag_push }}
  is_branch_push:
    description: 'Returns true if the event is a branch push'
    value: ${{ steps.metadata.outputs.is_branch_push }}
  is_pull_request:
    description: 'Returns true if the event is a pull request'
    value: ${{ steps.metadata.outputs.is_pull_request }}
  is_release:
    description: 'Returns true if the event is a release'
    value: ${{ steps.metadata.outputs.is_release }}
  is_schedule:
    description: 'Returns true if the event is scheduled'
    value: ${{ steps.metadata.outputs.is_schedule }}
  is_workflow_dispatch:
    description: 'Returns true if the event is manually triggered'
    value: ${{ steps.metadata.outputs.is_workflow_dispatch }}
  event_name:
    description: 'The name of the event that triggered the workflow'
    value: ${{ steps.metadata.outputs.event_name }}

  # Branch outputs
  branch_name:
    description: 'Returns the branch name (empty for tag pushes)'
    value: ${{ steps.metadata.outputs.branch_name }}
  is_default_branch:
    description: 'Returns true if running on the default branch'
    value: ${{ steps.metadata.outputs.is_default_branch }}
  is_main_branch:
    description: 'Returns true if running on main or master branch'
    value: ${{ steps.metadata.outputs.is_main_branch }}
  tag_name:
    description: 'Returns the tag name (empty if not a tag)'
    value: ${{ steps.metadata.outputs.tag_name }}

  # Commit outputs
  commit_sha:
    description: 'Full commit SHA'
    value: ${{ steps.metadata.outputs.commit_sha }}
  commit_sha_short:
    description: 'Short commit SHA (first 7 characters)'
    value: ${{ steps.metadata.outputs.commit_sha_short }}
  commit_message:
    description: 'Commit message title'
    value: ${{ steps.metadata.outputs.commit_message }}
  commit_author:
    description: 'Commit author name'
    value: ${{ steps.metadata.outputs.commit_author }}

  # Pull request outputs
  pr_number:
    description: 'Pull request number (empty if not a PR)'
    value: ${{ steps.metadata.outputs.pr_number }}
  pr_source_branch:
    description: 'Pull request source branch (head ref)'
    value: ${{ steps.metadata.outputs.pr_source_branch }}
  pr_target_branch:
    description: 'Pull request target branch (base ref)'
    value: ${{ steps.metadata.outputs.pr_target_branch }}
  is_fork:
    description: 'Returns true if pull request is from a fork'
    value: ${{ steps.metadata.outputs.is_fork }}
  pr_commits_count:
    description: 'Number of commits in the pull request'
    value: ${{ steps.metadata.outputs.pr_commits_count }}

  # Actor outputs
  actor:
    description: 'GitHub actor (user who triggered the workflow)'
    value: ${{ steps.metadata.outputs.actor }}
  actor_id:
    description: 'GitHub actor ID'
    value: ${{ steps.metadata.outputs.actor_id }}

  # Cache outputs
  cache_key:
    description: 'Generated cache key based on repository and commit'
    value: ${{ steps.metadata.outputs.cache_key }}
  cache_restore_key:
    description: 'Generated cache restore key prefix'
    value: ${{ steps.metadata.outputs.cache_restore_key }}

  # Workflow run outputs
  run_id:
    description: 'Workflow run ID'
    value: ${{ steps.metadata.outputs.run_id }}
  run_attempt:
    description: 'Workflow run attempt (1 for the first attempt)'
    value: ${{ steps.metadata.outputs.run_attempt }}
  run_number:
    description: 'Workflow run number'
    value: ${{ steps.metadata.outputs.run_number }}
  workflow:
    description: 'Workflow name'
    value: ${{ steps.metadata.outputs.workflow }}
  workflow_ref:
    description: 'Workflow file reference (owner/repo/path@ref)'
    value: ${{ steps.metadata.outputs.workflow_ref }}
  job:
    description: 'Job ID of the job that ran the action'
    value: ${{ steps.metadata.outputs.job }}
  run_url:
    description: 'URL of the workflow run (names the attempt after a re-run)'
    value: ${{ steps.metadata.outputs.run_url }}

  # Changed files outputs
  changed_files:
    description: 'List of changed files (newline-separated, push/PR events)'
    value: ${{ steps.metadata.outputs.changed_files }}
  changed_files_count:
    description: 'Number of changed files'
    value: ${{ steps.metadata.outputs.changed_files_count }}
  changed_files_added:
    description: 'List of added files (newline-separated)'
    value: ${{ steps.metadata.outputs.changed_files_added }}
  changed_files_added_count:
    description: 'Number of added files'
    value: ${{ steps.metadata.outputs.changed_files_added_count }}
  changed_files_modified:
    description: 'List of modified files (newline-separated)'
    value: ${{ steps.metadata.outputs.changed_files_modified }}
  changed_files_modified_count:
    description: 'Number of modified files'
    value: ${{ steps.metadata.outputs.changed_files_modified_count }}
  changed_files_removed:
    description: 'List of removed files (newline-separated)'
    value: ${{ steps.metadata.outputs.changed_files_removed }}
  changed_files_removed_count:
    description: 'Number of removed files'
    value: ${{ steps.metadata.outputs.changed_files_removed_count }}

  # Changed files last commit outputs
  changed_files_last_commit:
    description: 'List of changed files in last commit (newline-separated)'
    value: ${{ steps.metadata.outputs.changed_files_last_commit }}
  changed_files_last_commit_count:
    description: 'Number of changed files in last commit'
    value: ${{ steps.metadata.outputs.changed_files_last_commit_count }}
  changed_files_last_commit_added:
    description: 'List of added files in last commit (newline-separated)'
    value: ${{ steps.metadata.outputs.changed_files_last_commit_added }}
  changed_files_last_commit_added_count:
    description: 'Number of added files in last commit'
    value: ${{ steps.metadata.outputs.changed_files_last_commit_added_count }}
  changed_files_last_commit_modified:
    description: 'List of modified files in last commit (newline-separated)'
    value: ${{ steps.metadata.outputs.changed_files_last_commit_modified }}
  changed_files_last_commit_modified_count:
    description: 'Number of modified files in last commit'
    # yamllint disable-line rule:line-length
    value: ${{ steps.metadata.outputs.changed_files_last_commit_modified_count }}
  changed_files_last_commit_removed:
    description: 'List of removed files in last commit (newline-separated)'
    value: ${{ steps.metadata.outputs.changed_files_last_commit_removed }}
  changed_files_last_commit_removed_count:
    # yamllint disable-line rule:line-length
    description: 'Number of removed files in last commit'
    value: ${{ steps.metadata.outputs.changed_files_last_commit_removed_count }}

  # JSON output
  metadata_json:
    description: 'All metadata as a JSON object'
    value: ${{ steps.metadata.outputs.metadata_json }}

  # YAML output
  metadata_yaml:
    description: 'All metadata as a YAML object'
    value: ${{ steps.metadata.outputs.metadata_yaml }}

  # Artifact output
  artifact_path:
    description: 'Path to the metadata artifact files (if uploaded)'
    value: ${{ steps.metadata.outputs.artifact_path }}
  artifact_suffix:
    description: 'Unique suffix for artifact naming (to avoid conflicts)'
    value: ${{ steps.metadata.outputs.artifact_suffix }}

  # Gerrit outputs
  gerrit_json:
    # yamllint disable-line rule:line-length
    description: 'Gerrit metadata as JSON (from input or built from gerrit_to_platform inputs)'
    value: ${{ steps.metadata.outputs.gerrit_json }}

  # Dependency change outputs
  dependencies_changed:
    description: >-
      'true' or 'false' when detection resolved; empty when unresolved or
      when dependency_change is off
    value: ${{ steps.dependency-change-result.outputs.changed }}
  dependency_change_reason:
    description: >-
      One line saying why; empty when dependency_change is off
    value: ${{ steps.dependency-change-result.outputs.reason }}
  dependency_change_base:
    description: >-
      The commit compared against; empty when unresolved or off
    value: ${{ steps.dependency-change-result.outputs.base }}

runs:
  using: 'composite'
  steps:
    # The one interpreter this action runs: setup-python's absolute
    # python-path output. Later steps never look Python up on PATH or
    # let uv choose one, since a caller's earlier step can set PATH,
    # UV_PYTHON, VIRTUAL_ENV and similar variables for this job. It
    # runs first, leaving the checkout alone, so that the dependency
    # detector, which runs "python3" from PATH, can use it too.
    - name: 'Setup Python'
      id: setup-python
      # yamllint disable-line rule:line-length
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.11'

    # Dependency change detection runs before any step that could
    # change the checkout, so it sees it exactly as the caller left it.
    - name: 'Check dependency change inputs'
      id: dependency-change-setup
      shell: bash
      env:
        DEPENDENCY_CHANGE: ${{ inputs.dependency_change }}
        # The detector deletes whatever sits at its output path; use a
        # name of our own and never run it over an existing file.
        SIDECAR: '.repository-metadata-dependency-change.json'
        INTERPRETER: "${{ steps.setup-python.outputs.python-path }}"
      run: |
        # Validate the opt-in and check the sidecar path is free
        set -euo pipefail
        case "$DEPENDENCY_CHANGE" in
          true) ;;
          false) echo 'enabled=false' >> "$GITHUB_OUTPUT"; exit 0 ;;
          *) echo "::error::dependency_change must be 'true' or 'false' ❌"
             exit 1 ;;
        esac
        {
          echo 'enabled=true'
          echo "sidecar=$SIDECAR"
        } >> "$GITHUB_OUTPUT"
        # setup-python prepends its bin directory to PATH last, so the
        # runner puts it ahead of any directory a caller added. Verify
        # rather than assume: this step sees the detector's PATH.
        trusted=''
        case "$INTERPRETER" in
          /*) trusted="${INTERPRETER%/*}/python3" ;;
        esac
        found="$(command -v python3 || true)"
        found="${found//[$'\r\n']/}"
        reason=''
        if [ -e "$SIDECAR" ] || [ -L "$SIDECAR" ]; then
          reason="unresolved: ${SIDECAR} already exists; detection skipped"
          echo "::warning::${reason}"
        elif [ -z "$trusted" ] || [ ! -x "$trusted" ] \
          || [ "$found" != "$trusted" ]; then
          reason='unresolved: python3 is not the trusted interpreter;'
          reason="$reason detection skipped"
          echo "::warning::${reason} (python3 resolves to '${found}')"
        fi
        if [ -n "$reason" ]; then
          {
            echo 'run=false'
            echo "reason=$reason"
          } >> "$GITHUB_OUTPUT"
        else
          echo 'run=true' >> "$GITHUB_OUTPUT"
        fi

    - name: 'Detect dependency changes'
      id: dependency-change
      if: steps.dependency-change-setup.outputs.run == 'true'
      # yamllint disable-line rule:line-length
      uses: lfreleng-actions/dependency-change-action@f647bde4268bb2831d30d3c36c2db55dcc274ae2  # v0.1.0
      env:
        # The detector runs "python3 -I", but these still redirect the
        # interpreter on macOS under -I; empty values are ignored.
        PYTHONEXECUTABLE: ''
        __PYVENV_LAUNCHER__: ''
      with:
        # Empty selects every preset dependency-change-action v0.1.0
        # defines; keep this list in step with the pinned version.
        # yamllint disable-line rule:line-length
        ecosystems: ${{ inputs.dependency_ecosystems || 'node,python,go,maven,gradle,rust,docker' }}
        patterns: ${{ inputs.dependency_patterns }}
        path-prefix: ${{ inputs.dependency_path_prefix }}
        gerrit-refspec: ${{ inputs.gerrit_refspec }}
        base: ${{ inputs.dependency_base }}
        output: ${{ steps.dependency-change-setup.outputs.sidecar }}

    - name: 'Report dependency change'
      id: dependency-change-result
      if: steps.dependency-change-setup.outputs.enabled == 'true'
      shell: bash
      env:
        DETECTOR_OUTCOME: ${{ steps.dependency-change.outcome }}
        SIDECAR: ${{ steps.dependency-change-setup.outputs.sidecar }}
        SKIP_REASON: ${{ steps.dependency-change-setup.outputs.reason }}
        CHANGED: ${{ steps.dependency-change.outputs.changed }}
        REASON: ${{ steps.dependency-change.outputs.reason }}
        BASE: ${{ steps.dependency-change.outputs.base }}
      run: |
        # Publish the verdict and remove the sidecar the detector wrote
        set -euo pipefail
        if [ "$DETECTOR_OUTCOME" = 'success' ]; then
          # The path was free before detection, so this is the detector's
          rm -f -- "$SIDECAR"
        else
          REASON="$SKIP_REASON"
        fi
        # Fail closed: anything but a resolved verdict leaves both empty
        case "$CHANGED" in
          true|false) ;;
          *) CHANGED=''; BASE='' ;;
        esac
        REASON="${REASON//[$'\r\n']/ }"
        BASE="${BASE//[$'\r\n']/}"
        {
          echo "changed=$CHANGED"
          echo "reason=$REASON"
          echo "base=$BASE"
        } >> "$GITHUB_OUTPUT"
        echo "Dependency change: $REASON" | tee -a "$GITHUB_STEP_SUMMARY"

    # setup-uv's only uv call for these inputs is "uv python find",
    # whose result it executes. An invalid preference makes uv refuse
    # its arguments before any lookup; setup-uv then reports the
    # Python version as "unknown", which nothing reads. The working
    # directory keeps uv away from the caller's checkout.
    - name: 'Install uv'
      id: setup-uv
      # yamllint disable-line rule:line-length
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      with:
        working-directory: "${{ github.action_path }}"
        # Without it setup-uv puts the caller's HOME/XDG_* bin dir on PATH
        tool-bin-dir: "${{ runner.temp }}/repository-metadata-action/bin"
        # The post-step "uv cache prune" would hit the invalid preference
        enable-cache: false
      env:
        UV_NO_CONFIG: '1'
        UV_NO_PROJECT: '1'
        UV_PYTHON_PREFERENCE: 'lookup-disabled'
        # Inherited, it makes setup-uv probe uv, which the line above fails
        UV_PYTHON_ARCH: ''
        # yamllint disable-line rule:line-length
        UV_PYTHON_INSTALL_DIR: "${{ runner.temp }}/repository-metadata-action/python"

    - name: 'Install Python dependencies'
      shell: bash
      working-directory: "${{ github.action_path }}"
      env:
        UV: "${{ steps.setup-uv.outputs.uv-path }}"
        INTERPRETER: "${{ steps.setup-python.outputs.python-path }}"
        # An action-owned cache, not one a caller variable points at
        UV_CACHE_DIR: "${{ runner.temp }}/repository-metadata-action/cache"
      run: |
        # Install into the trusted interpreter only
        set -euo pipefail
        case "$INTERPRETER" in
          /*) ;;
          *) echo "Error: setup-python gave no absolute interpreter ❌"
             exit 1 ;;
        esac
        # The package build runs Python without -I; drop the caller's
        # PYTHON* settings so they cannot redirect it.
        while IFS= read -r name; do
          case "$name" in
            PYTHON*|__PYVENV_LAUNCHER__) unset "$name" ;;
          esac
        done < <(compgen -e)
        "$UV" pip install --no-config --python "$INTERPRETER" .

    - name: 'Extract Repository Metadata'
      id: metadata
      shell: bash
      working-directory: "${{ github.action_path }}"
      env:
        DEBUG_MODE: ${{ inputs.debug }}
        GITHUB_TOKEN_INPUT: ${{ inputs.github_token }}
        GITHUB_SUMMARY: ${{ inputs.github_summary }}
        ARTIFACT_UPLOAD: ${{ inputs.artifact_upload }}
        ARTIFACT_FORMATS: ${{ inputs.artifact_formats }}
        CHANGE_DETECTION: ${{ inputs.change_detection }}
        GIT_FETCH_DEPTH: ${{ inputs.git_fetch_depth }}
        GERRIT_SUMMARY: ${{ inputs.gerrit_summary }}
        FILES_SUMMARY: ${{ inputs.files_summary }}
        GERRIT_INCLUDE_COMMENT: ${{ inputs.gerrit_include_comment }}
        REPO_VISIBILITY: ${{ github.event.repository.visibility }}
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_ACTOR_ID: ${{ github.actor_id }}
        PR_HEAD_REPO_FORK: ${{ github.event.pull_request.head.repo.fork }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        INTERPRETER: "${{ steps.setup-python.outputs.python-path }}"
      run: |
        # Isolated mode ignores PYTHON* settings and the working
        # directory; src imports from the package installed above.
        # PYTHONEXECUTABLE and __PYVENV_LAUNCHER__ still redirect the
        # interpreter on macOS under -I, so drop the caller's copies.
        while IFS= read -r name; do
          case "$name" in
            PYTHON*|__PYVENV_LAUNCHER__) unset "$name" ;;
          esac
        done < <(compgen -e)
        "$INTERPRETER" -I -m src.main

    - name: 'Upload metadata artifact'
      if: inputs.artifact_upload == 'true'
      # yamllint disable-line rule:line-length
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        # yamllint disable-line rule:line-length
        name: ${{ github.job }}-${{ steps.metadata.outputs.artifact_suffix }}
        # yamllint disable-line rule:line-length
        path: ${{ runner.temp }}/repository-metadata-${{ steps.metadata.outputs.artifact_suffix }}/
        if-no-files-found: warn
        retention-days: 90
